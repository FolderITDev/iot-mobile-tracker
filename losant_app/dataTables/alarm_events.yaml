    description: >-
      Generic alarm/event log shared by all alarm types (geofence enter/exit
      today, others in the future). One row per event. 

      Columns: 

      organizationId (String, required) - tenant, Experience Group ID. 

      deviceId (String, required) - Losant device ID. 

      deviceName (String, optional) - device name at the time of the event. 

      type (String, required) - event type in "domain.event" format, e.g.
      "geofence.enter", "geofence.exit". severity (String, required) - "info",
      "warning" or "critical". 

      refId (String, optional) - ID of the object that triggered the event (e.g.
      geofence id). 

      refName (String, optional) - name of that object at the time of the
      event. 

      message (String, required) - human-readable text shown in the UI. 

      location (String, optional) - device position "lat,lng" when the event
      happened. 

      eventTime (Number, required) - epoch milliseconds of the device message
      (not the processing time).

      data (String, optional) - JSON with type-specific details.
