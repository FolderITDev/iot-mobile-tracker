      - config:
          scopePath: ''
          script: >
            /*
             * Function node "Evaluate geofences"
             * Workflow: Geofences - Evaluator (application workflow, Device: State trigger)
             *
             * Input (payload):
             *   data.location           "lat,lng" from the received state
             *   time                    state timestamp
             *   deviceId, deviceName    from the trigger
             *   working.assignments     Table: Get Rows on geofence_devices (deviceId = this device)
             *   working.geofences       Table: Get Rows on geofences (organizationId = device's org)
             *
             * Output:
             *   working.updates   [{ rowId, state, stateChangedAt }]  -> Table: Update Row on geofence_devices
             *   working.events    complete rows for alarm_events      -> Table: Insert Row
             *   stateChangedAt and eventTime are epoch milliseconds (Data Tables have no date type)
             *   working.hasUpdates / working.hasEvents  (booleans for the Conditional nodes)
             *
             * The geometry matches the UI (experience/pages/Fleet Map.hbs:
             * gfOutside / gfNextState). If you change one, change the other.
             */

            var HYSTERESIS_M = 20; // to exit, the device must move this far
            past the edge (avoids GPS jitter)


            function toRad(d) { return d * Math.PI / 180; }


            function haversine(a, b) {
              var dLat = toRad(b.lat - a.lat);
              var dLng = toRad(b.lng - a.lng);
              var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
              return 2 * 6371000 * Math.asin(Math.sqrt(h));
            }


            // epoch ms from a number, numeric string, Date or ISO string

            function toMs(v) {
              if (v == null || v === '') return null;
              if (typeof v === 'number') return v;
              if (/^\d+$/.test(String(v))) return Number(v);
              var t = new Date(v).getTime();
              return isFinite(t) ? t : null;
            }


            function toLatLng(lat, lng) {
              lat = parseFloat(lat);
              lng = parseFloat(lng);
              if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
              return { lat: lat, lng: lng };
            }


            function parseLocation(v) {
              if (v == null) return null;
              if (typeof v === 'string') {
                var p = v.split(',');
                return p.length < 2 ? null : toLatLng(p[0], p[1]);
              }
              if (Array.isArray(v)) return toLatLng(v[0], v[1]);
              if (typeof v === 'object') return toLatLng(v.lat != null ? v.lat : v.latitude, v.lng != null ? v.lng : v.longitude);
              return null;
            }


            function rowsOf(x) {
              if (!x) return [];
              if (Array.isArray(x)) return x;
              return x.items || x.rows || [];
            }


            function normalize(raw) {
              var shape = raw.shape === 'polygon' ? 'polygon' : 'circle';
              var g = { shape: shape, center: toLatLng(raw.centerLat, raw.centerLng), radiusM: parseFloat(raw.radiusM) || 0, polygon: [] };
              if (shape === 'polygon') {
                var pts = raw.polygon;
                if (typeof pts === 'string') {
                  try { pts = JSON.parse(pts); } catch (e) { pts = []; }
                }
                g.polygon = (Array.isArray(pts) ? pts : []).map(parseLocation).filter(Boolean);
                return g.polygon.length >= 3 ? g : null;
              }
              return g.center && g.radiusM > 0 ? g : null;
            }


            function localXY(origin, p) {
              return {
                x: toRad(p.lng - origin.lng) * 6371000 * Math.cos(toRad(origin.lat)),
                y: toRad(p.lat - origin.lat) * 6371000
              };
            }


            function originToSegment(a, b) {
              var dx = b.x - a.x;
              var dy = b.y - a.y;
              var len2 = dx * dx + dy * dy;
              var t = len2 ? Math.max(0, Math.min(1, -(a.x * dx + a.y * dy) / len2)) : 0;
              return Math.sqrt(Math.pow(a.x + t * dx, 2) + Math.pow(a.y + t * dy, 2));
            }


            // distance in meters to the edge: negative inside, positive outside

            function outside(g, p) {
              if (g.shape === 'circle') return haversine(g.center, p) - g.radiusM;
              var pts = g.polygon.map(function (q) { return localXY(p, q); });
              var inside = false;
              var edge = Infinity;
              for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
                var a = pts[i];
                var b = pts[j];
                if ((a.y > 0) !== (b.y > 0) && (b.x - a.x) * -a.y / (b.y - a.y) + a.x > 0) inside = !inside;
                edge = Math.min(edge, originToSegment(a, b));
              }
              return inside ? -edge : edge;
            }


            function nextState(g, p, prev) {
              var out = outside(g, p);
              if (out <= 0) return 'inside';
              return prev === 'inside' && out <= HYSTERESIS_M ? 'inside' : 'outside';
            }


            var working = payload.working = payload.working || {};

            var point = parseLocation(payload.data && payload.data.location);

            var timeMs = toMs(payload.time) || Date.now();

            var updates = [];

            var events = [];


            if (point) {
              var byId = {};
              rowsOf(working.geofences).forEach(function (g) { byId[String(g.id)] = g; });

              rowsOf(working.assignments).forEach(function (a) {
                var raw = byId[String(a.geofenceId)];
                if (!raw) return; // geofence deleted or from another organization
                var prev = a.state || 'unknown';

                // disabled: forget the state so re-enabling it does not produce a false event
                if (raw.enabled === false || raw.enabled === 'false') {
                  if (prev !== 'unknown') updates.push({ rowId: a.id, state: 'unknown', stateChangedAt: timeMs });
                  return;
                }

                // old message that arrived out of order
                if (toMs(a.stateChangedAt) > timeMs) return;

                var g = normalize(raw);
                if (!g) return;
                var next = nextState(g, point, prev);
                if (next === prev) return;

                updates.push({ rowId: a.id, state: next, stateChangedAt: timeMs });
                if (prev === 'unknown') return; // first evaluation: store the state without logging an event

                var entered = next === 'inside';
                events.push({
                  organizationId: raw.organizationId || a.organizationId,
                  deviceId: payload.device.deviceId,
                  deviceName: payload.device.name || payload.device.deviceId,
                  type: entered ? 'geofence.enter' : 'geofence.exit',
                  severity: 'info',
                  refId: String(raw.id),
                  refName: raw.name,
                  message: (payload.device.name || payload.device.deviceId) + (entered ? ' entered ' : ' exited ') + raw.name,
                  location: point.lat + ',' + point.lng,
                  eventTime: timeMs,
                  data: JSON.stringify({ shape: g.shape, distanceM: Math.round(outside(g, point)) })
                });
              });
            }


            working.updates = updates;

            working.events = events;

            working.hasUpdates = updates.length > 0;

            working.hasEvents = events.length > 0;
        id: dRQEsRjnrM
