      - config:
          scopePath: ''
          script: >-
            // Branch B: builds the Losant location state from a Traccar
            position.

            // Input:   payload.working.thisPosition.value  (Traccar position)

            //          payload.working.lastPositionId      (last processed id,
            may be missing)

            // Output:  payload.working.skip                (true = discard)

            //          payload.working.skipReason

            //          payload.working.state               (attributes for
            Device State)

            //          payload.working.stateTime           (fixTime in ms, for
            the Device State Time field)


            const KNOTS_TO_KMH = 1.852;


            const w = payload.working = payload.working || {};

            const p = w.thisPosition.value;


            w.skip = true;

            w.skipReason = null;

            w.state = null;

            w.stateTime = null;


            if (!p || typeof p !== 'object') {
              w.skipReason = 'no position';
              return;
            }


            // Deduplicate: on reconnect, the socket resends the last position
            of each device.

            const posId = Number(p.id);

            const lastId = Number(w.lastPositionId);

            if (Number.isFinite(lastId) && posId <= lastId) {
              w.skipReason = 'position already processed (' + posId + ' <= ' + lastId + ')';
              return;
            }


            // Discard invalid fixes or out-of-range coordinates.

            const lat = Number(p.latitude);

            const lon = Number(p.longitude);

            if (p.valid === false) {
              w.skipReason = 'invalid GPS fix';
              return;
            }

            if (!Number.isFinite(lat) || !Number.isFinite(lon) ||
                Math.abs(lat) > 90 || Math.abs(lon) > 180 || (lat === 0 && lon === 0)) {
              w.skipReason = 'invalid coordinates';
              return;
            }


            const round = (n, d) => Math.round(n * Math.pow(10, d)) /
            Math.pow(10, d);


            const state = {
              location: lat + ',' + lon,
              lastPositionId: posId
            };


            const speed = Number(p.speed);

            if (Number.isFinite(speed)) state.speed = round(speed *
            KNOTS_TO_KMH, 1);


            const course = Number(p.course);

            if (Number.isFinite(course)) state.course = round(course, 0);


            const altitude = Number(p.altitude);

            if (Number.isFinite(altitude)) state.altitude = round(altitude, 1);


            const attrs = p.attributes || {};

            if (typeof attrs.ignition === 'boolean') state.ignition =
            attrs.ignition;


            // Battery: Traccar may send batteryLevel (%) and/or battery
            (internal cell voltage).

            // Prefer the device-reported percentage; otherwise estimate it from
            the voltage.

            const toNum = (v) => (v === null || v === undefined || v === '') ?
            NaN : Number(v);


            // Typical single-cell Li-ion discharge curve (volts -> %),
            interpolated linearly.

            const LIION_CURVE = [
              [3.00, 0], [3.30, 5], [3.50, 10], [3.60, 20], [3.70, 40],
              [3.80, 60], [3.90, 75], [4.00, 85], [4.10, 95], [4.20, 100]
            ];

            const voltsToPercent = (v) => {
              if (v <= LIION_CURVE[0][0]) return 0;
              for (let i = 1; i < LIION_CURVE.length; i++) {
                const [v1, p1] = LIION_CURVE[i];
                if (v <= v1) {
                  const [v0, p0] = LIION_CURVE[i - 1];
                  return round(p0 + (v - v0) * (p1 - p0) / (v1 - v0), 0);
                }
              }
              return 100;
            };


            let batteryVolts = toNum(attrs.battery);

            if (batteryVolts > 100) batteryVolts = batteryVolts / 1000; // some
            devices report mV


            const batteryLevel = toNum(attrs.batteryLevel);

            if (Number.isFinite(batteryLevel) && batteryLevel >= 0 &&
            batteryLevel <= 100) {
              state.batteryLevel = round(batteryLevel, 0);
            } else if (Number.isFinite(batteryVolts) && batteryVolts > 0) {
              state.batteryLevel = voltsToPercent(batteryVolts);
            }


            // fixTime comes as UTC ISO-8601; if missing or unparseable, fall
            back to the current time.

            const fix = Date.parse(p.fixTime || p.deviceTime || p.serverTime);

            w.stateTime = Number.isFinite(fix) ? fix : Date.now();


            w.state = state;

            w.skip = false;
        id: fcbahLKckv
