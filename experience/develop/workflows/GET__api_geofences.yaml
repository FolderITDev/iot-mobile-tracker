      - config:
          scopePath: ''
          script: |
            /*
             * Function node "Build geofences response"
             * Workflow: API Geofences, GET /api/geofences branch
             *
             * Input (payload):
             *   working.geofences     Table: Get Rows on "geofences"        (organizationId = org)
             *   working.assignments   Table: Get Rows on "geofence_devices" (organizationId = org)
             *
             * Output:
             *   working.response = { geofences: [{ ...row, devices: [{ deviceId, state, stateChangedAt }] }] }
             *   -> Endpoint Reply with body {{jsonEncode working.response}}
             */

            function rowsOf(x) {
              if (!x) return [];
              if (Array.isArray(x)) return x;
              return x.items || x.rows || [];
            }

            var working = payload.working = payload.working || {};
            var byGeofence = {};

            rowsOf(working.assignments).forEach(function (a) {
              var key = String(a.geofenceId);
              (byGeofence[key] = byGeofence[key] || []).push({
                deviceId: a.deviceId,
                state: a.state || 'unknown',
                stateChangedAt: a.stateChangedAt || null
              });
            });

            working.response = {
              geofences: rowsOf(working.geofences).map(function (g) {
                return {
                  id: g.id,
                  name: g.name,
                  shape: g.shape,
                  color: g.color,
                  enabled: g.enabled,
                  centerLat: g.centerLat,
                  centerLng: g.centerLng,
                  radiusM: g.radiusM,
                  polygon: g.polygon,
                  updatedAt: g.updatedAt,
                  devices: byGeofence[String(g.id)] || []
                };
              })
            };
        id: OwXSfV8_w2
        meta:
          category: logic
          description: ''
          label: Function
          name: function
          x: 60
          'y': 380
        outputIds:
          - - _jByUnMFYp
        type: RawFunctionNode
      - config:
          scopePath: ''
          script: >
            /*
             * Function node "Validate geofence"
             * Workflow: API Geofences, POST /api/geofences and PATCH /api/geofences/{geofenceId} branches
             *
             * Input (payload):
             *   data.body            JSON sent by the UI:
             *                        { name, shape, color, enabled, centerLat, centerLng, radiusM, polygon, deviceIds }
             *   working.orgId        user's organizationId (same one used by /api/fleet)
             *   working.orgDevices   (optional) Device: Get with the organization's devices;
             *                        when present, deviceIds outside the org are dropped
             *
             * Output:
             *   working.error        string when the body is invalid (reply 400 with { error })
             *   working.row          columns ready for Table: Insert Row / Update Row on "geofences"
             *   working.deviceIds    ids to assign (Insert Row loop on "geofence_devices")
             */

            var body = (payload.data && payload.data.body) || {};

            var working = payload.working = payload.working || {};

            working.error = null;


            function fail(msg) { working.error = msg; }


            function num(v) {
              var n = parseFloat(v);
              return isFinite(n) ? n : null;
            }


            function validLat(v) { return v !== null && Math.abs(v) <= 90; }

            function validLng(v) { return v !== null && Math.abs(v) <= 180; }


            var name = String(body.name || '').trim().slice(0, 60);

            var shape = body.shape === 'polygon' ? 'polygon' : 'circle';

            var color = /^#[0-9a-f]{6}$/i.test(body.color || '') ? body.color :
            '#2563eb';

            var row = {
              organizationId: working.orgId,
              name: name,
              shape: shape,
              color: color,
              enabled: body.enabled !== false && body.enabled !== 'false',
              centerLat: num(body.centerLat),
              centerLng: num(body.centerLng),
              radiusM: 0,
              polygon: ''
            };


            if (!working.orgId) fail('Usuario sin organización.');

            else if (!name) fail('Falta el nombre.');

            else if (!validLat(row.centerLat) || !validLng(row.centerLng))
            fail('Centro inválido.');

            else if (shape === 'circle') {
              row.radiusM = Math.round(num(body.radiusM) || 0);
              if (row.radiusM < 20 || row.radiusM > 50000) fail('El radio tiene que estar entre 20 m y 50 km.');
            } else {
              var pts = body.polygon;
              if (typeof pts === 'string') {
                try { pts = JSON.parse(pts); } catch (e) { pts = null; }
              }
              if (!Array.isArray(pts) || pts.length < 3 || pts.length > 100) {
                fail('El polígono necesita entre 3 y 100 vértices.');
              } else {
                var clean = pts.map(function (p) {
                  var lat = num(p && p[0]);
                  var lng = num(p && p[1]);
                  return validLat(lat) && validLng(lng) ? [Math.round(lat * 1e6) / 1e6, Math.round(lng * 1e6) / 1e6] : null;
                });
                if (clean.some(function (p) { return !p; })) fail('Hay vértices inválidos.');
                else row.polygon = JSON.stringify(clean);
              }
            }


            var ids = Array.isArray(body.deviceIds) ? body.deviceIds.map(String)
            : [];

            var devices = working.orgDevices && (working.orgDevices.items ||
            working.orgDevices);

            if (Array.isArray(devices)) {
              var allowed = {};
              devices.forEach(function (d) { allowed[String(d.id || d.deviceId)] = true; });
              ids = ids.filter(function (id) { return allowed[id]; });
            }

            // remove duplicates

            working.deviceIds = ids.filter(function (id, i) { return
            ids.indexOf(id) === i; });

            working.row = row;
        id: Uuz2QRvT4L
